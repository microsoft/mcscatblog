<rect x="855.7" y="136.0" width="141.1" height="116.0" rx="10" fill="#e8f1fc" stroke="#2a78d6" stroke-width="1.5"/>
<text x="869.7" y="161.0" font-size="13" font-weight="600" fill="#52514e" text-anchor="start" letter-spacing="0.9">CODE</text>
<text x="869.7" y="190.0" font-size="18" font-weight="600" fill="#0b0b0b" text-anchor="start">Remove and</text>
<text x="869.7" y="213.0" font-size="18" font-weight="600" fill="#0b0b0b" text-anchor="start">validate</text>
<line x1="1000.9" y1="194.0" x2="1013.9" y2="194.0" stroke="#52514e" stroke-width="1.6" stroke-linecap="round" marker-end="url(#arr)"/>
<rect x="1018.9" y="136.0" width="141.1" height="116.0" rx="10" fill="#e8f1fc" stroke="#2a78d6" stroke-width="1.5"/>
<text x="1032.9" y="161.0" font-size="13" font-weight="600" fill="#52514e" text-anchor="start" letter-spacing="0.9">CODE</text>
<text x="1032.9" y="190.0" font-size="18" font-weight="600" fill="#0b0b0b" text-anchor="start">Save and</text>
<text x="1032.9" y="213.0" font-size="18" font-weight="600" fill="#0b0b0b" text-anchor="start">verify</text>
<rect x="40.0" y="298.0" width="548.0" height="177.0" rx="12" fill="#fdeee7" stroke="#eb6834" stroke-width="1.5"/>
<text x="66.0" y="342.0" font-size="22" font-weight="600" fill="#0b0b0b" text-anchor="start">The agent decides</text>
<circle cx="71.0" cy="374.0" r="4" fill="#eb6834"/>
<text x="88.0" y="380.0" font-size="18" font-weight="400" fill="#52514e" text-anchor="start">Which source text belongs under each template field</text>
<circle cx="71.0" cy="407.0" r="4" fill="#eb6834"/>
<text x="88.0" y="413.0" font-size="18" font-weight="400" fill="#52514e" text-anchor="start">What the source does not state, written as “Not provided”</text>
<circle cx="71.0" cy="440.0" r="4" fill="#eb6834"/>
<text x="88.0" y="446.0" font-size="18" font-weight="400" fill="#52514e" text-anchor="start">Which template-only text, such as author notes, to remove</text>
<rect x="612.0" y="298.0" width="548.0" height="177.0" rx="12" fill="#e8f1fc" stroke="#2a78d6" stroke-width="1.5"/>
<text x="638.0" y="342.0" font-size="22" font-weight="600" fill="#0b0b0b" text-anchor="start">The code does</text>
<circle cx="643.0" cy="374.0" r="4" fill="#2a78d6"/>
<text x="660.0" y="380.0" font-size="18" font-weight="400" fill="#52514e" text-anchor="start">Reads the template’s fields and the source text</text>
<circle cx="643.0" cy="407.0" r="4" fill="#2a78d6"/>
<text x="660.0" y="413.0" font-size="18" font-weight="400" fill="#52514e" text-anchor="start">Edits the document file and keeps its formatting</text>
<circle cx="643.0" cy="440.0" r="4" fill="#2a78d6"/>
<text x="660.0" y="446.0" font-size="18" font-weight="400" fill="#52514e" text-anchor="start">Checks the document and the size of the stored file</text>
<text x="40.0" y="515.0" font-size="18" font-weight="400" fill="#52514e" text-anchor="start">Document bytes never pass through the conversation. The agent hands the code a field map, and the code edits the file.</text>
</svg>
