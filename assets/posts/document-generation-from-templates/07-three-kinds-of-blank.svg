<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="600" viewBox="0 0 1200 600" role="img" font-family="'Segoe UI', system-ui, -apple-system, 'Helvetica Neue', Arial, sans-serif">
<title>Three ways a template marks a blank</title>
<desc>A content control, whose field name is carried in the w:tag or w:alias attribute of a w:sdt element. A token, which is literal double-brace text in the paragraph. And a labelled blank, which is an empty run whose name is the label in the paragraph beside it. Inspection discovers all three at runtime and reports which label it paired with each blank, so a wrong pairing is visible.</desc>
<defs>
  <filter id="c" x="-20%" y="-20%" width="140%" height="150%">
    <feDropShadow dx="0" dy="2" stdDeviation="4" flood-color="#2a2a2a" flood-opacity="0.10"/>
  </filter>
</defs>

<rect x="0.8" y="0.8" width="1198.5" height="598.5" rx="16" fill="#fcfcfb" stroke="#e1e0d9" stroke-width="1.5"/>

<text x="40" y="58" font-size="30" font-weight="600" fill="#0b0b0b">Three ways a template marks a blank</text>
<text x="40" y="92" font-size="18" fill="#52514e">Real templates use all three, often in the same file. Inspection finds them at runtime.</text>

<!-- ============ 1. CONTENT CONTROL ============ -->
<rect x="40" y="130" width="344" height="356" rx="12" fill="#f5f4ef" stroke="#e1e0d9" stroke-width="1.5"/>
<circle cx="68" cy="164" r="14" fill="#2a78d6"/>
<text x="68" y="170" font-size="15" font-weight="700" fill="#ffffff" text-anchor="middle">1</text>
<text x="92" y="170" font-size="19" font-weight="600" fill="#0b0b0b">Content control</text>
<text x="68" y="196" font-size="14" font-weight="600" fill="#2a78d6" letter-spacing="0.6">THE WELL-BEHAVED CASE</text>

<g filter="url(#c)"><rect x="68" y="218" width="288" height="96" rx="8" fill="#ffffff" stroke="#c9c7bd" stroke-width="1.5"/></g>
<text x="88" y="246" font-size="14" font-weight="600" fill="#52514e">Role Title</text>
<rect x="88" y="258" width="248" height="34" rx="5" fill="#eef4fd" stroke="#2a78d6" stroke-width="1.5" stroke-dasharray="5 4"/>
<text x="100" y="281" font-size="15" fill="#7d7a72" font-style="italic">Click to enter text</text>

<text x="68" y="346" font-size="15" font-family="Consolas, 'Courier New', monospace" fill="#3d3b36">&lt;w:sdt&gt;</text>
<text x="84" y="370" font-size="15" font-family="Consolas, 'Courier New', monospace" fill="#3d3b36">&lt;w:tag w:val=</text>
<text x="216" y="370" font-size="15" font-family="Consolas, 'Courier New', monospace" fill="#2a78d6">"Role Title"</text>
<text x="68" y="394" font-size="15" font-family="Consolas, 'Courier New', monospace" fill="#3d3b36">&lt;/w:sdt&gt;</text>

<text x="68" y="432" font-size="16" fill="#52514e">The name lives in the</text>
<text x="68" y="454" font-size="16" fill="#52514e">tag or alias attribute.</text>

<!-- ============ 2. TOKEN ============ -->
<rect x="428" y="130" width="344" height="356" rx="12" fill="#f5f4ef" stroke="#e1e0d9" stroke-width="1.5"/>
<circle cx="456" cy="164" r="14" fill="#2a78d6"/>
<text x="456" y="170" font-size="15" font-weight="700" fill="#ffffff" text-anchor="middle">2</text>
<text x="480" y="170" font-size="19" font-weight="600" fill="#0b0b0b">Token</text>
<text x="456" y="196" font-size="14" font-weight="600" fill="#2a78d6" letter-spacing="0.6">THE EASY CASE</text>

<g filter="url(#c)"><rect x="456" y="218" width="288" height="96" rx="8" fill="#ffffff" stroke="#c9c7bd" stroke-width="1.5"/></g>
<text x="476" y="246" font-size="14" font-weight="600" fill="#52514e">Role Title</text>
<rect x="476" y="260" width="196" height="30" rx="5" fill="#fdeee7"/>
<text x="486" y="281" font-size="16" font-family="Consolas, 'Courier New', monospace" fill="#bf5320">{{Role Title}}</text>

<text x="456" y="346" font-size="15" font-family="Consolas, 'Courier New', monospace" fill="#3d3b36">TOKEN_RE = re.compile(</text>
<text x="472" y="370" font-size="15" font-family="Consolas, 'Courier New', monospace" fill="#2a78d6">r"\{\{\s*([\w.\- ]+?)\s*\}\}"</text>
<text x="456" y="394" font-size="15" font-family="Consolas, 'Courier New', monospace" fill="#3d3b36">)</text>

<text x="456" y="432" font-size="16" fill="#52514e">Literal text in the</text>
<text x="456" y="454" font-size="16" fill="#52514e">paragraph. Matched directly.</text>

<!-- ============ 3. LABELLED BLANK ============ -->
<rect x="816" y="130" width="344" height="356" rx="12" fill="#fdf7f3" stroke="#f0d5c5" stroke-width="1.5"/>
<circle cx="844" cy="164" r="14" fill="#eb6834"/>
<text x="844" y="170" font-size="15" font-weight="700" fill="#ffffff" text-anchor="middle">3</text>
<text x="868" y="170" font-size="19" font-weight="600" fill="#0b0b0b">Labelled blank</text>
<text x="844" y="196" font-size="14" font-weight="600" fill="#bf5320" letter-spacing="0.6">THE MESSY CASE</text>

<g filter="url(#c)"><rect x="844" y="218" width="288" height="96" rx="8" fill="#ffffff" stroke="#c9c7bd" stroke-width="1.5"/></g>
<text x="864" y="252" font-size="16" font-weight="600" fill="#0b0b0b">Reports to:</text>
<line x1="984" y1="256" x2="1112" y2="256" stroke="#c9c7bd" stroke-width="2"/>
<text x="864" y="292" font-size="14" fill="#7d7a72">no name anywhere in the XML</text>

<path d="M900 322 v18" stroke="#eb6834" stroke-width="2" stroke-dasharray="4 3"/>
<text x="844" y="362" font-size="16" fill="#52514e">The field is named by the</text>
<text x="844" y="384" font-size="16" fill="#52514e">label beside it.</text>

<rect x="844" y="404" width="288" height="62" rx="8" fill="#fdeee7" stroke="#eb6834" stroke-width="1.5"/>
<text x="862" y="428" font-size="15" fill="#8a4318">Inspection reports which label</text>
<text x="862" y="450" font-size="15" fill="#8a4318">it chose, so a wrong pairing shows.</text>

<!-- footer -->
<line x1="40" y1="514" x2="1160" y2="514" stroke="#e1e0d9" stroke-width="1.5"/>
<text x="40" y="552" font-size="17" fill="#52514e">Nothing is cached. Each run rediscovers the fields, so a renamed or reordered template needs no code change.</text>
</svg>
