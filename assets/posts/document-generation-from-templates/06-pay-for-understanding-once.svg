<text x="159.0" y="756.0" font-size="16" font-weight="400" fill="#52514e" text-anchor="start">Code and connectors</text>
<rect x="335.0" y="743.0" width="16.0" height="16.0" rx="4" fill="#e5f6ef" stroke="#1baf7a" stroke-width="1.5"/>
<text x="359.0" y="756.0" font-size="16" font-weight="400" fill="#52514e" text-anchor="start">Person</text>
<rect x="437.0" y="743.0" width="16.0" height="16.0" rx="4" fill="#f3f2ef" stroke="#898781" stroke-width="1.5"/>
<text x="461.0" y="756.0" font-size="16" font-weight="400" fill="#52514e" text-anchor="start">Documents and stored data</text>
</svg>
