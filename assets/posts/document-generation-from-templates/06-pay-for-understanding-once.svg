<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="790" viewBox="0 0 1200 790" role="img" font-family="'Segoe UI', system-ui, -apple-system, 'Helvetica Neue', Arial, sans-serif">
<title>Proposed design: read each document once, regenerate on every template change</title>
<desc>Proposed design, not yet built. Once per document: the agent reads the source document and decides which text belongs under each field, a person resolves missing values and open choices, and the result is kept as stored field data tied to the source version. On every template change: code discovers the fields of the new template, a person confirms renamed fields once per template, and code regenerates each document from the stored field data with no agent call. When a new template asks for something no stored data holds, the agent is asked that one question for each document.</desc>
<defs><marker id="arr" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0.8 L9,5 L0,9.2 z" fill="#52514e"/></marker></defs>
<rect x="0.8" y="0.8" width="1198.5" height="788.5" rx="16" fill="#fcfcfb" stroke="#e1e0d9" stroke-width="1.5"/>
<text x="40.0" y="60.0" font-size="30" font-weight="600" fill="#0b0b0b" text-anchor="start">Pay for understanding once</text>
<text x="40.0" y="92.0" font-size="19" font-weight="400" fill="#52514e" text-anchor="start">Read each document once. Regenerate on every template change.</text>
<rect x="890.9" y="40.0" width="269.1" height="30.0" rx="15" fill="#ffffff" stroke="#0b0b0b" stroke-width="1.5"/>
<text x="904.9" y="60.0" font-size="13" font-weight="600" fill="#0b0b0b" text-anchor="start" letter-spacing="0.9">PROPOSED DESIGN, NOT YET BUILT</text>
<text x="40.0" y="160.0" font-size="13" font-weight="600" fill="#6f6d68" text-anchor="start" letter-spacing="0.9">ONCE PER DOCUMENT</text>
<text x="40.0" y="415.0" font-size="13" font-weight="600" fill="#6f6d68" text-anchor="start" letter-spacing="0.9">ON EVERY TEMPLATE CHANGE</text>
<rect x="40.0" y="176.0" width="256.0" height="159.0" rx="10" fill="#f3f2ef" stroke="#898781" stroke-width="1.5"/>
<text x="58.0" y="205.0" font-size="13" font-weight="600" fill="#52514e" text-anchor="start" letter-spacing="0.9">DOCUMENT</text>
<text x="58.0" y="236.0" font-size="20" font-weight="600" fill="#0b0b0b" text-anchor="start">Source document</text>
<text x="58.0" y="264.0" font-size="17" font-weight="400" fill="#52514e" text-anchor="start">One of many in the</text>
<text x="58.0" y="287.0" font-size="17" font-weight="400" fill="#52514e" text-anchor="start">library.</text>
<rect x="328.0" y="176.0" width="256.0" height="159.0" rx="10" fill="#fdeee7" stroke="#eb6834" stroke-width="1.5"/>
<text x="346.0" y="205.0" font-size="13" font-weight="600" fill="#52514e" text-anchor="start" letter-spacing="0.9">AGENT</text>
<text x="346.0" y="236.0" font-size="20" font-weight="600" fill="#0b0b0b" text-anchor="start">Agent reads and maps</text>
<text x="346.0" y="264.0" font-size="17" font-weight="400" fill="#52514e" text-anchor="start">Decides which text belongs</text>
<text x="346.0" y="287.0" font-size="17" font-weight="400" fill="#52514e" text-anchor="start">under each field.</text>
<rect x="616.0" y="176.0" width="256.0" height="159.0" rx="10" fill="#e5f6ef" stroke="#1baf7a" stroke-width="1.5"/>
<text x="634.0" y="205.0" font-size="13" font-weight="600" fill="#52514e" text-anchor="start" letter-spacing="0.9">PERSON</text>
<text x="634.0" y="236.0" font-size="20" font-weight="600" fill="#0b0b0b" text-anchor="start">Person resolves what is</text>
<text x="634.0" y="262.0" font-size="20" font-weight="600" fill="#0b0b0b" text-anchor="start">marked</text>
<text x="634.0" y="290.0" font-size="17" font-weight="400" fill="#52514e" text-anchor="start">Missing values and open</text>
<text x="634.0" y="313.0" font-size="17" font-weight="400" fill="#52514e" text-anchor="start">choices.</text>
<rect x="904.0" y="176.0" width="256.0" height="159.0" rx="10" fill="#f3f2ef" stroke="#898781" stroke-width="1.5"/>
<text x="922.0" y="205.0" font-size="13" font-weight="600" fill="#52514e" text-anchor="start" letter-spacing="0.9">STORED DATA</text>
<text x="922.0" y="236.0" font-size="20" font-weight="600" fill="#0b0b0b" text-anchor="start">Stored field data</text>
<text x="922.0" y="264.0" font-size="17" font-weight="400" fill="#52514e" text-anchor="start">Each field’s value, tied to the</text>
<text x="922.0" y="287.0" font-size="17" font-weight="400" fill="#52514e" text-anchor="start">source version.</text>
<line x1="302.0" y1="255.5" x2="320.0" y2="255.5" stroke="#52514e" stroke-width="1.75" stroke-linecap="round" marker-end="url(#arr)"/>
<line x1="590.0" y1="255.5" x2="608.0" y2="255.5" stroke="#52514e" stroke-width="1.75" stroke-linecap="round" marker-end="url(#arr)"/>
<line x1="878.0" y1="255.5" x2="896.0" y2="255.5" stroke="#52514e" stroke-width="1.75" stroke-linecap="round" marker-end="url(#arr)"/>
<rect x="40.0" y="431.0" width="256.0" height="159.0" rx="10" fill="#f3f2ef" stroke="#898781" stroke-width="1.5"/>
<text x="58.0" y="460.0" font-size="13" font-weight="600" fill="#52514e" text-anchor="start" letter-spacing="0.9">DOCUMENT</text>
<text x="58.0" y="491.0" font-size="20" font-weight="600" fill="#0b0b0b" text-anchor="start">New template version</text>
<text x="58.0" y="519.0" font-size="17" font-weight="400" fill="#52514e" text-anchor="start">Approved and published.</text>
<rect x="328.0" y="431.0" width="256.0" height="159.0" rx="10" fill="#e8f1fc" stroke="#2a78d6" stroke-width="1.5"/>
<text x="346.0" y="460.0" font-size="13" font-weight="600" fill="#52514e" text-anchor="start" letter-spacing="0.9">CODE</text>
<text x="346.0" y="491.0" font-size="20" font-weight="600" fill="#0b0b0b" text-anchor="start">Code discovers its fields</text>
<text x="346.0" y="519.0" font-size="17" font-weight="400" fill="#52514e" text-anchor="start">The same inspection step as</text>
<text x="346.0" y="542.0" font-size="17" font-weight="400" fill="#52514e" text-anchor="start">today.</text>
<rect x="616.0" y="431.0" width="256.0" height="159.0" rx="10" fill="#e5f6ef" stroke="#1baf7a" stroke-width="1.5"/>
<text x="634.0" y="460.0" font-size="13" font-weight="600" fill="#52514e" text-anchor="start" letter-spacing="0.9">PERSON</text>
<text x="634.0" y="491.0" font-size="20" font-weight="600" fill="#0b0b0b" text-anchor="start">Person confirms</text>
<text x="634.0" y="517.0" font-size="20" font-weight="600" fill="#0b0b0b" text-anchor="start">renamed fields</text>
<text x="634.0" y="545.0" font-size="17" font-weight="400" fill="#52514e" text-anchor="start">Once per template, not once</text>
<text x="634.0" y="568.0" font-size="17" font-weight="400" fill="#52514e" text-anchor="start">per document.</text>
<rect x="904.0" y="431.0" width="256.0" height="159.0" rx="10" fill="#e8f1fc" stroke="#2a78d6" stroke-width="1.5"/>
<text x="922.0" y="460.0" font-size="13" font-weight="600" fill="#52514e" text-anchor="start" letter-spacing="0.9">CODE</text>
<text x="922.0" y="491.0" font-size="20" font-weight="600" fill="#0b0b0b" text-anchor="start">Code regenerates each</text>
<text x="922.0" y="517.0" font-size="20" font-weight="600" fill="#0b0b0b" text-anchor="start">document</text>
<text x="922.0" y="545.0" font-size="17" font-weight="400" fill="#52514e" text-anchor="start">From stored field data, with</text>
<text x="922.0" y="568.0" font-size="17" font-weight="400" fill="#52514e" text-anchor="start">no agent call.</text>
<line x1="302.0" y1="510.5" x2="320.0" y2="510.5" stroke="#52514e" stroke-width="1.75" stroke-linecap="round" marker-end="url(#arr)"/>
<line x1="590.0" y1="510.5" x2="608.0" y2="510.5" stroke="#52514e" stroke-width="1.75" stroke-linecap="round" marker-end="url(#arr)"/>
<line x1="878.0" y1="510.5" x2="896.0" y2="510.5" stroke="#52514e" stroke-width="1.75" stroke-linecap="round" marker-end="url(#arr)"/>
<line x1="1032.0" y1="342.0" x2="1032.0" y2="422.0" stroke="#52514e" stroke-width="1.75" stroke-linecap="round" marker-end="url(#arr)"/>
<text x="1018.0" y="389.0" font-size="15" font-weight="400" fill="#52514e" text-anchor="end">feeds every regeneration</text>
<rect x="40.0" y="624.0" width="1120.0" height="88.0" rx="10" fill="#fdeee7" stroke="#eb6834" stroke-width="1.5"/>
<text x="66.0" y="657.0" font-size="13" font-weight="600" fill="#52514e" text-anchor="start" letter-spacing="0.9">AGENT, ONLY WHEN NEEDED</text>
<text x="66.0" y="690.0" font-size="18" font-weight="400" fill="#0b0b0b" text-anchor="start">When a new template asks for something no stored data holds, the agent is asked that one question for each document.</text>
<rect x="40.0" y="743.0" width="16.0" height="16.0" rx="4" fill="#fdeee7" stroke="#eb6834" stroke-width="1.5"/>
<text x="64.0" y="756.0" font-size="16" font-weight="400" fill="#52514e" text-anchor="start">Agent</text>
