<svg xmlns="http://www.w3.org/2000/svg" width="1456" height="800" viewBox="0 0 1456 800" role="img" font-family="'Segoe UI', system-ui, -apple-system, 'Helvetica Neue', Arial, sans-serif">
<title>On-behalf-of sign-in for the MCP tool</title>
<desc>Mario asks the IT Helpdesk standard agent in Microsoft 365 Copilot. The first time, he selects Allow on a Connect to continue card. The HR Policy custom connector sends Mario's token, issued for the connector app, plus the connector's client ID and secret to Microsoft Entra ID, and gets back a new token for Mario that's valid for the Copilot Studio MCP endpoint. The HR Policy agent receives the call as Mario.</desc>
<defs>
  <marker id="ab" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#2563EB"/></marker>
  <marker id="av" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#7C3AED"/></marker>
  <filter id="sh" x="-10%" y="-10%" width="120%" height="130%"><feDropShadow dx="0" dy="6" stdDeviation="10" flood-color="#0F172A" flood-opacity="0.10"/></filter>
</defs>

<rect width="1456" height="800" fill="#F6F8FC"/>

<text x="60" y="70" font-size="32" font-weight="700" fill="#0F172A">On-behalf-of sign-in: every hop runs as the user</text>
<text x="60" y="106" font-size="19" fill="#475569">Standard agent → MCP tool → Microsoft Copilot harness agent, with the connector set to Entra ID + on-behalf-of</text>

<!-- Card 1: user -->
<g filter="url(#sh)"><rect x="60" y="160" width="290" height="190" rx="20" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="2"/></g>
<rect x="84" y="184" width="74" height="30" rx="15" fill="#F1F5F9"/>
<text x="121" y="205" text-anchor="middle" font-size="16" font-weight="600" fill="#334155">User</text>
<text x="84" y="252" font-size="28" font-weight="700" fill="#0F172A">Mario</text>
<text x="84" y="284" font-size="17" fill="#475569">Microsoft 365 Copilot</text>
<text x="84" y="310" font-size="17" fill="#475569">Signed in once</text>

<!-- Card 2: calling agent -->
<g filter="url(#sh)"><rect x="410" y="160" width="290" height="190" rx="20" fill="#FFFFFF" stroke="#BFDBFE" stroke-width="2"/></g>
<rect x="434" y="184" width="104" height="30" rx="15" fill="#DBEAFE"/>
<text x="486" y="205" text-anchor="middle" font-size="16" font-weight="600" fill="#1D4ED8">Standard</text>
<text x="434" y="252" font-size="28" font-weight="700" fill="#0F172A">IT Helpdesk</text>
<text x="434" y="284" font-size="17" fill="#475569">Calling agent</text>
<text x="434" y="310" font-size="17" fill="#475569">MCP tool: HR Policy</text>

<!-- Card 3: connector -->
<g filter="url(#sh)"><rect x="760" y="160" width="290" height="190" rx="20" fill="#FFFFFF" stroke="#BFDBFE" stroke-width="2"/></g>
<rect x="784" y="184" width="150" height="30" rx="15" fill="#DBEAFE"/>
<text x="859" y="205" text-anchor="middle" font-size="16" font-weight="600" fill="#1D4ED8">Custom connector</text>
<text x="784" y="252" font-size="28" font-weight="700" fill="#0F172A">HR Policy</text>
<text x="784" y="284" font-size="17" fill="#475569">Entra ID provider</text>
<text x="784" y="310" font-size="17" fill="#475569">On-behalf-of: true</text>

<!-- Card 4: called agent -->
<g filter="url(#sh)"><rect x="1110" y="160" width="290" height="190" rx="20" fill="#FFFFFF" stroke="#DDD6FE" stroke-width="2"/></g>
<rect x="1134" y="184" width="226" height="30" rx="15" fill="#EDE9FE"/>
<text x="1247" y="205" text-anchor="middle" font-size="16" font-weight="600" fill="#6D28D9">Microsoft Copilot harness</text>
<text x="1134" y="252" font-size="28" font-weight="700" fill="#0F172A">HR Policy</text>
<text x="1134" y="284" font-size="17" fill="#475569">Called agent</text>
<text x="1134" y="310" font-size="17" fill="#475569">MCP endpoint</text>

<!-- Arrows between cards -->
<line x1="352" y1="230" x2="404" y2="230" stroke="#2563EB" stroke-width="3" marker-end="url(#ab)"/>
<line x1="702" y1="230" x2="754" y2="230" stroke="#2563EB" stroke-width="3" marker-end="url(#ab)"/>
<line x1="1052" y1="230" x2="1104" y2="230" stroke="#7C3AED" stroke-width="3" marker-end="url(#av)"/>

<!-- Step labels -->
<circle cx="378" cy="270" r="15" fill="#2563EB"/><text x="378" y="276" text-anchor="middle" font-size="16" font-weight="700" fill="#FFFFFF">1</text>
<circle cx="728" cy="270" r="15" fill="#2563EB"/><text x="728" y="276" text-anchor="middle" font-size="16" font-weight="700" fill="#FFFFFF">2</text>
<circle cx="1078" cy="270" r="15" fill="#7C3AED"/><text x="1078" y="276" text-anchor="middle" font-size="16" font-weight="700" fill="#FFFFFF">4</text>

<!-- Consent card callout under cards 1-2 -->
<rect x="60" y="400" width="640" height="170" rx="18" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="2"/>
<text x="84" y="436" font-size="18" font-weight="700" fill="#0F172A">1  First call only: consent in the chat</text>
<rect x="84" y="456" width="300" height="92" rx="12" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="2"/>
<text x="104" y="486" font-size="16" font-weight="600" fill="#334155">Connect to continue</text>
<text x="104" y="510" font-size="14" fill="#64748B">HR Policy</text>
<rect x="104" y="520" width="70" height="20" rx="10" fill="#1F2937"/><text x="139" y="535" text-anchor="middle" font-size="13" font-weight="600" fill="#FFFFFF">Allow</text>
<rect x="186" y="520" width="70" height="20" rx="10" fill="#E5E7EB"/><text x="221" y="535" text-anchor="middle" font-size="13" fill="#374151">Cancel</text>
<text x="404" y="482" font-size="16" fill="#475569">No connection manager.</text>
<text x="404" y="508" font-size="16" fill="#475569">Allow creates the user's</text>
<text x="404" y="534" font-size="16" fill="#475569">connection. Later questions</text>
<text x="404" y="560" font-size="16" fill="#475569">don't ask again.</text>

<!-- Token A callout -->
<rect x="60" y="596" width="640" height="84" rx="18" fill="#FFFFFF" stroke="#BFDBFE" stroke-width="2"/>
<text x="84" y="628" font-size="18" font-weight="700" fill="#0F172A">2  Token A, issued to Mario</text>
<text x="84" y="658" font-size="16" fill="#475569">audience: connector app (api://{client-id})  ·  scope: access_as_user  ·  via Azure API Connections</text>

<!-- Entra ID -->
<g filter="url(#sh)"><rect x="760" y="420" width="640" height="260" rx="20" fill="#E8EEF9" stroke="#C7D4EE" stroke-width="2" stroke-dasharray="8 8"/></g>
<g transform="translate(812 476)">
  <path d="M0 -26 L22 -17 L22 4 C22 18 12 28 0 33 C-12 28 -22 18 -22 4 L-22 -17 Z" fill="#FFFFFF" stroke="#2563EB" stroke-width="3"/>
  <path d="M-9 3 L-2 10 L10 -5" fill="none" stroke="#2563EB" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/>
</g>
<text x="852" y="466" font-size="20" font-weight="700" fill="#1E3A8A">3  Microsoft Entra ID swaps the token</text>
<text x="852" y="494" font-size="16" fill="#334155">In: Token A + the connector's client ID and secret</text>
<text x="852" y="522" font-size="16" fill="#334155">Out: Token B, still issued to Mario</text>
<text x="852" y="548" font-size="16" fill="#334155">  audience: api.powerplatform.com/copilotstudio-mcp</text>
<text x="852" y="574" font-size="16" fill="#334155">  scope: MCS.InvokeAsMCP (admin consent granted)</text>

<!-- Arrows connector <-> Entra -->
<line x1="880" y1="352" x2="880" y2="414" stroke="#2563EB" stroke-width="3" marker-end="url(#ab)"/>
<line x1="940" y1="414" x2="940" y2="352" stroke="#2563EB" stroke-width="3" marker-end="url(#ab)"/>
<text x="892" y="390" font-size="14" fill="#1D4ED8">A</text>
<text x="952" y="390" font-size="14" fill="#1D4ED8">B</text>

<!-- Footer band -->
<rect x="60" y="708" width="1340" height="64" rx="16" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="2"/>
<text x="84" y="748" font-size="18" fill="#0F172A"><tspan font-weight="700">4  HR Policy sees Mario,</tspan> not the connector or the calling agent. The connector's secret only proves it may swap Mario's token.</text>
</svg>
