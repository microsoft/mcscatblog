<svg xmlns="http://www.w3.org/2000/svg" width="1456" height="816" viewBox="0 0 1456 816" role="img" font-family="'Segoe UI', system-ui, -apple-system, 'Helvetica Neue', Arial, sans-serif">
<title>A GitHub Copilot harness agent called through MCP as a tool and through A2A as a peer</title>
<desc>A standard agent calls the GitHub Copilot harness agent through its MCP endpoint as a tool. A GitHub Copilot harness agent in another environment calls it through its A2A endpoint as a peer. Both calls pass through Microsoft Entra ID as the signed-in user. An agent in the same environment connects directly as a connected agent.</desc>
<defs>
  <marker id="arrow-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#2563EB"/></marker>
  <marker id="arrow-violet" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#7C3AED"/></marker>
  <marker id="arrow-gray" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#64748B"/></marker>
  <filter id="shadow" x="-10%" y="-10%" width="120%" height="130%"><feDropShadow dx="0" dy="6" stdDeviation="10" flood-color="#0F172A" flood-opacity="0.10"/></filter>
</defs>

<rect width="1456" height="816" fill="#F6F8FC"/>

<!-- Entra ID band -->
<rect x="560" y="120" width="120" height="576" rx="18" fill="#E8EEF9" stroke="#C7D4EE" stroke-width="2" stroke-dasharray="8 8"/>
<g transform="translate(620 164)">
  <path d="M0 -26 L22 -17 L22 4 C22 18 12 28 0 33 C-12 28 -22 18 -22 4 L-22 -17 Z" fill="#FFFFFF" stroke="#2563EB" stroke-width="3"/>
  <path d="M-9 3 L-2 10 L10 -5" fill="none" stroke="#2563EB" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/>
</g>
<text x="620" y="226" text-anchor="middle" font-size="19" font-weight="600" fill="#1E3A8A">Microsoft</text>
<text x="620" y="250" text-anchor="middle" font-size="19" font-weight="600" fill="#1E3A8A">Entra ID</text>
<text x="620" y="644" text-anchor="middle" font-size="16" fill="#475569">as the</text>
<text x="620" y="666" text-anchor="middle" font-size="16" fill="#475569">signed-in user</text>

<!-- Standard agent (caller, MCP) -->
<g filter="url(#shadow)">
  <rect x="80" y="196" width="380" height="150" rx="20" fill="#FFFFFF" stroke="#BFDBFE" stroke-width="2"/>
</g>
<rect x="104" y="222" width="104" height="30" rx="15" fill="#DBEAFE"/>
<text x="156" y="243" text-anchor="middle" font-size="16" font-weight="600" fill="#1D4ED8">Standard</text>
<text x="104" y="290" font-size="28" font-weight="700" fill="#0F172A">IT Helpdesk agent</text>
<text x="104" y="322" font-size="18" fill="#475569">In production. Not rebuilt.</text>

<!-- GHCP agent in other environment (caller, A2A) -->
<g filter="url(#shadow)">
  <rect x="80" y="470" width="380" height="150" rx="20" fill="#FFFFFF" stroke="#DDD6FE" stroke-width="2"/>
</g>
<rect x="104" y="496" width="230" height="30" rx="15" fill="#EDE9FE"/>
<text x="219" y="517" text-anchor="middle" font-size="16" font-weight="600" fill="#6D28D9">GitHub Copilot harness</text>
<text x="104" y="564" font-size="28" font-weight="700" fill="#0F172A">Sales Quote agent</text>
<text x="104" y="596" font-size="18" fill="#475569">Sales environment</text>

<!-- Called agent -->
<g filter="url(#shadow)">
  <rect x="780" y="176" width="400" height="464" rx="24" fill="#FFFFFF" stroke="#C4B5FD" stroke-width="2.5"/>
</g>
<rect x="808" y="206" width="230" height="30" rx="15" fill="#EDE9FE"/>
<text x="923" y="227" text-anchor="middle" font-size="16" font-weight="600" fill="#6D28D9">GitHub Copilot harness</text>
<text x="808" y="282" font-size="30" font-weight="700" fill="#0F172A">Device Compliance</text>
<text x="808" y="318" font-size="30" font-weight="700" fill="#0F172A">agent</text>
<text x="808" y="352" font-size="18" fill="#475569">Published · Early environment</text>

<!-- MCP port -->
<rect x="808" y="392" width="344" height="92" rx="16" fill="#EFF6FF" stroke="#93C5FD" stroke-width="2"/>
<text x="832" y="430" font-size="22" font-weight="700" fill="#1D4ED8">MCP endpoint</text>
<text x="832" y="460" font-size="17" fill="#1E40AF" font-family="Consolas, 'Cascadia Mono', monospace">send-message</text>

<!-- A2A port -->
<rect x="808" y="508" width="344" height="104" rx="16" fill="#F5F3FF" stroke="#C4B5FD" stroke-width="2"/>
<text x="832" y="546" font-size="22" font-weight="700" fill="#6D28D9">A2A endpoint</text>
<text x="832" y="576" font-size="17" fill="#5B21B6" font-family="Consolas, 'Cascadia Mono', monospace">SendMessage</text>
<text x="832" y="598" font-size="17" fill="#5B21B6" font-family="Consolas, 'Cascadia Mono', monospace">agent-card.json</text>

<!-- MCP arrow -->
<path d="M460 271 C 600 271, 640 438, 802 438" fill="none" stroke="#2563EB" stroke-width="4" marker-end="url(#arrow-blue)"/>
<rect x="470" y="396" width="168" height="34" rx="17" fill="#2563EB"/>
<text x="554" y="419" text-anchor="middle" font-size="17" font-weight="600" fill="#FFFFFF">MCP · as a tool</text>

<!-- A2A arrow -->
<path d="M460 545 C 600 545, 640 560, 802 560" fill="none" stroke="#7C3AED" stroke-width="4" marker-end="url(#arrow-violet)"/>
<rect x="470" y="490" width="168" height="34" rx="17" fill="#7C3AED"/>
<text x="554" y="513" text-anchor="middle" font-size="17" font-weight="600" fill="#FFFFFF">A2A · as a peer</text>

<!-- Connected agent, same environment -->
<g filter="url(#shadow)">
  <rect x="1236" y="330" width="170" height="156" rx="18" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="2"/>
</g>
<text x="1321" y="380" text-anchor="middle" font-size="19" font-weight="700" fill="#0F172A">Connected</text>
<text x="1321" y="404" text-anchor="middle" font-size="19" font-weight="700" fill="#0F172A">agent</text>
<text x="1321" y="438" text-anchor="middle" font-size="15" fill="#475569">Same environment</text>
<text x="1321" y="460" text-anchor="middle" font-size="15" fill="#475569">No URL, no OAuth</text>
<path d="M1232 408 L1186 408" fill="none" stroke="#64748B" stroke-width="3" stroke-dasharray="7 6" marker-end="url(#arrow-gray)"/>
</svg>
